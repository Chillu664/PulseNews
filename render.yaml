services:
  - type: web
    name: pulsenews
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NEWS_PROVIDER
        value: rss
      - key: NEWS_REFRESH_INTERVAL_MS
        value: "900000"
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
